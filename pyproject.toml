[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "discfem"
version = "0.0.1"
description = "Solver FEM axisimétrico (r, z) de la ecuación de calor transitoria en un disco de freno"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pyyaml",
    "gmsh",
    "meshio",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# TRY004: los errores de configuración del usuario (incluidos los de tipo en el YAML) se
# reportan siempre como ValueError con mensaje en español, para manejarlos de forma uniforme.
extend-ignore = ["TRY004"]

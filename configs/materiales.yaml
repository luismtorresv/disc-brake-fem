# Librería de materiales (PLAN.md §4; formato con secciones de la Fase 7).
#
# materials: cada entrada OBLIGA a `source` y `verified` (CLAUDE.md, regla 4). Mientras
#   `verified: false`, cada corrida imprime una advertencia con la lista.
# presets:   materiales de disco y pastilla por tipo de vehículo; en la config de una corrida
#   basta `materials: {preset: car}`. Lo que se escriba explícitamente en `regions` o `pad`
#   tiene prioridad sobre el preset.
#
# gray_cast_iron y organic_pad: SUPUESTOS DEL PROTOTIPO del PLAN, sin fuente. Se conservan
# porque el caso de referencia (ejemplo_frenado.yaml) y las pruebas T8/T9 están definidos con
# ellos; no los use para resultados del informe.
#
# *_limpert: Limpert, R., "Brake Design and Safety", 2.ª ed., SAE, Tabla 3-1A (p. 123).
#   El libro da k en N·m/(h·K·m); aquí está dividido por 3600 → W/(m·K). Verificado contra la
#   tabla SI y la imperial 3-1B (28 BTU/h°F ft = 48,46 W/mK; 0,10 BTU/lb°F = 418,7 J/kgK;
#   0,7 BTU/h°F ft = 1,21 W/mK) y contra la difusividad tabulada a = k/(ρc).
#   Nota: para el disco la tabla imperial da 455 lbm/ft³ ≈ 7288 kg/m³; se usa el valor SI 7228.
#
# stainless_steel_410: ficha técnica "Aleación 410" de Chilexpo SpA (UNS S41000). verified:
#   false porque (1) la propia ficha declara que es una recopilación (ATI, SSC, Outokumpu) "no
#   verificada de forma independiente"; (2) su calor específico dice "0,46 Btu/lb/ºF", unidad
#   errónea: 0,46 BTU/(lb·°F) = 1926 J/(kg·K) es imposible para un acero; se toma 0,46 kJ/(kg·K)
#   = 460 J/(kg·K) (≡ 0,11 BTU/(lb·°F), valor usual del 410); (3) su densidad, 0,266 lb/in³ =
#   7363 kg/m³, es menor que la de otras fuentes del 410 (≈ 0,28 lb/in³ ≈ 7750 kg/m³). Se usa
#   tal cual la ficha; conviene contrastarla con la del fabricante del acero (ATI/Outokumpu).
#
# sintered_pad_goo2014: pastilla sinterizada (pines de fricción del tren KTX), Goo y Na (2014),
#   Tabla 1. Es la única fuente encontrada con ρ, c y k juntos para un material de fricción
#   sinterizado (el ASM Handbook Vol. 7 y las fichas de SBS/Brembo no los dan). verified: false
#   porque (1) son valores de ENTRADA de un modelo FEM, el artículo no dice que se midieran ni
#   cita su origen; (2) c = 418 J/(kg·K) es idéntico al del disco de acero de la misma tabla
#   (posible copia); (3) la aplicación es ferroviaria, no de motocicleta. Se usa en el preset
#   `motorcycle` como la aproximación más cercana disponible a una pastilla sinterizada.

materials:
  gray_cast_iron_limpert:
    description: Hierro fundido (tambor o disco), valores de diseño de Limpert
    k: 48.4625       # W/(m·K)  = 174 465 N·m/(h·K·m) / 3600
    rho: 7228.0      # kg/m³
    cp: 419.0        # J/(kg·K)
    source: "Limpert, Brake Design and Safety, 2a ed., SAE, Tabla 3-1A 'Brake Design Values, SI Units', columna Drum or Disc, p. 123"
    verified: true

  pad_limpert:
    description: Pastilla de disco (base asbesto según el libro), valores de diseño de Limpert
    k: 1.2116666666666667   # W/(m·K) = 4362 N·m/(h·K·m) / 3600
    rho: 2595.0      # kg/m³
    cp: 1465.0       # J/(kg·K)
    source: "Limpert, Brake Design and Safety, 2a ed., SAE, Tabla 3-1A 'Brake Design Values, SI Units', columna Pad, p. 123 (el texto aclara que son materiales a base de asbesto; los semimetálicos tienen mayor ρ y k)"
    verified: true

  stainless_steel_410:
    description: Acero inoxidable martensítico AISI 410 (discos de motocicleta)
    k: 26.9          # W/(m·K) a 100 °C (187 BTU·in/(h·ft²·°F))
    rho: 7362.854652913201   # kg/m³ = 0,266 lb/in³ × 27 679,9 (valor de la ficha; ver nota)
    cp: 460.0        # J/(kg·K) = "0,46" de la ficha leído como kJ/(kg·K), 0–100 °C (ver nota)
    source: "Chilexpo SpA, ficha técnica 'Aleación 410' (UNS S41000 / DIN X15Cr13 / W.N. 1.4006), Propiedades físicas: densidad 0,266 lb/in3; calor específico 0-100 °C '0,46 Btu/lb/ºF' (unidad errónea en la ficha; se usa 0,46 kJ/(kg·K)); conductividad 26,9 W/m·K a 100 °C. La ficha es una recopilación de ATI, SSC y Outokumpu no verificada independientemente."
    verified: false

  sintered_pad_goo2014:
    description: Pastilla sinterizada de base metálica (pin de fricción del KTX), aproximación para moto
    k: 24.0          # W/(m·K)
    rho: 5400.0      # kg/m³ (5,4 g/cm³)
    cp: 418.0        # J/(kg·K)
    source: "Goo, B.-C. y Na, I.-K., 'Topology Optimization of Railway Brake Pad by Contact Analysis', J. Korean Soc. Tribol. Lubr. Eng. 30(3):177-182, 2014, DOI 10.9725/kstle.2014.30.3.177, Tabla 1 'Friction pin'. Valores de entrada de un modelo FEM (no medidos ni referenciados en el artículo); c igual al del disco de acero de la misma tabla; aplicación ferroviaria."
    verified: false

  lining_limpert:
    description: Forro de freno de tambor (base asbesto), valores de diseño de Limpert
    k: 1.1594444444444445   # W/(m·K) = 4174 N·m/(h·K·m) / 3600
    rho: 2034.0      # kg/m³
    cp: 1256.0       # J/(kg·K)
    source: "Limpert, Brake Design and Safety, 2a ed., SAE, Tabla 3-1A 'Brake Design Values, SI Units', columna Lining, p. 123"
    verified: true

  gray_cast_iron:
    description: Hierro fundido gris (disco)
    k: 50.0          # W/(m·K)   SUPUESTO DEL PROTOTIPO
    rho: 7200.0      # kg/m³     SUPUESTO DEL PROTOTIPO
    cp: 460.0        # J/(kg·K)  SUPUESTO DEL PROTOTIPO
    source: "PENDIENTE: citar fuente"
    verified: false

  organic_pad:
    description: Pastilla orgánica (solo efusividad para γ)
    k: 1.5           # W/(m·K)   SUPUESTO DEL PROTOTIPO
    rho: 2500.0      # kg/m³     SUPUESTO DEL PROTOTIPO
    cp: 1000.0       # J/(kg·K)  SUPUESTO DEL PROTOTIPO
    source: "PENDIENTE: citar fuente"
    verified: false

presets:
  car:
    description: Automóvil de pasajeros, disco de hierro fundido y pastilla (Limpert, Tabla 3-1A)
    disc: gray_cast_iron_limpert
    pad: pad_limpert
  motorcycle:
    description: Motocicleta, disco de acero inoxidable AISI 410 y pastilla sinterizada (Goo y Na 2014; ambos sin verificar)
    disc: stainless_steel_410
    pad: sintered_pad_goo2014
